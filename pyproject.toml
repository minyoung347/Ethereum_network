[project]
name = "ethereum-network"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "cairocffi>=1.7.1",
    "igraph>=0.11.8",
    "ipykernel>=6.29.5",
    "matplotlib>=3.7.5",
    "networkx>=3.1",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "powerlaw>=2.0.0",
    "pulp<2.8",
    "pycairo>=1.26.1",
    "python-dateutil>=2.9.0.post0",
    "scipy>=1.10.1",
    "seaborn>=0.13.2",
    "snakemake>=7.32.4",
    "statsmodels>=0.14.1",
    "tqdm>=4.68.3",
]

[tool.setuptools.packages.find]
include = ["ethereum_network*"]
exclude = ["data*", "figures*", "workflow*", "notebooks*"]
